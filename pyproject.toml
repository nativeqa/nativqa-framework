[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nativqa-framework"
dynamic = ["version"]
description = "Collect multilingual, culturally aligned question-answering datasets from search results for LLM evaluation."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "CC-BY-NC-SA-4.0"
license-files = ["licenses_by-nc-sa_4.0_legalcode.txt"]
authors = [
  { name = "Firoj Alam" },
  { name = "Md Arid Hasan" },
  { name = "Sahinur Rahman Laskar" },
  { name = "Mucahid Kutlu" },
  { name = "Shammur Absar Chowdhury" }
]
keywords = [
  "question-answering",
  "dataset-collection",
  "search",
  "multilingual",
  "evaluation",
  "natural-language-processing",
  "llm-evaluation",
  "benchmark-construction",
  "culturally-aligned-qa",
  "visual-question-answering",
  "natural-queries"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "google-search-results>=2.4.2,<3",
  "python-dotenv>=1.0.1,<2",
  "tqdm>=4.66.6,<5"
]

[project.urls]
Homepage = "https://nativeqa.github.io/"
Repository = "https://github.com/nativeqa/nativqa-framework"
Documentation = "https://github.com/nativeqa/nativqa-framework#readme"
"Bug Tracker" = "https://github.com/nativeqa/nativqa-framework/issues"
Changelog = "https://github.com/nativeqa/nativqa-framework/blob/main/CHANGELOG.md"

[project.scripts]
nativqa = "nativqa.nativqa_framework:main"

[tool.setuptools.dynamic]
version = { attr = "nativqa.__version__" }

[tool.setuptools.packages.find]
include = ["nativqa"]
