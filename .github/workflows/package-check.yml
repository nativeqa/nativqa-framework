name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [current]
        include:
          - os: ubuntu-latest
            python: "3.9"
            dependencies: minimum
          - os: windows-latest
            python: "3.13"
            dependencies: current
          - os: macos-latest
            python: "3.13"
            dependencies: current
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Install minimum supported dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'google-search-results==2.4.2' 'python-dotenv==1.0.1' 'tqdm==4.66.6'
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          nativqa --help
          nativqa --version
          python -I -m nativqa --help
          python -I -m nativqa --version
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_nativqa.py
      - name: Install source distribution
        run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz
      - name: Test installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          nativqa --version
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_nativqa.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.dependencies == 'current'
        with:
          name: python-distributions
          path: dist/*
